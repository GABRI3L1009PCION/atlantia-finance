<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlantia Finance · Sin conexión</title>
    <link rel="stylesheet" href="offline.css">
</head>
<body>
    <header class="bar">
        <div class="brand">
            <span class="mark" aria-hidden="true">A</span>
            <div>
                <strong>Atlantia Finance</strong>
                <span id="firm" class="muted"></span>
            </div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">
            <span class="dot"></span>
            <span id="status-text">Sin conexión con el servidor</span>
        </div>
        <button type="button" class="ghost" id="retry">Reintentar conexión</button>
    </header>

    <main id="app">
        <section class="notice" id="notice" hidden></section>

        <div class="toolbar" id="toolbar" hidden>
            <label class="company">
                <span>Empresa</span>
                <select id="company"></select>
            </label>
            <nav class="tabs" aria-label="Secciones">
                <button type="button" data-tab="summary" aria-pressed="true">Resumen</button>
                <button type="button" data-tab="receivables" aria-pressed="false">Por cobrar</button>
                <button type="button" data-tab="payables" aria-pressed="false">Por pagar</button>
                <button type="button" data-tab="activity" aria-pressed="false">Movimientos</button>
                <button type="button" data-tab="captures" aria-pressed="false">Capturas <span class="count" id="pending-count">0</span></button>
            </nav>
            <div class="actions">
                <button type="button" class="primary" data-new="sale">Nueva venta</button>
                <button type="button" class="primary" data-new="purchase">Nueva compra</button>
                <button type="button" class="primary" data-new="journal">Nuevo asiento</button>
            </div>
        </div>

        <section id="view"></section>
    </main>

    <dialog id="form-dialog">
        <form id="capture-form" method="dialog">
            <h2 id="form-title"></h2>
            <p class="muted">Se guarda en este equipo, cifrado. Cuando vuelva la conexión se sube como borrador para que el contador lo revise.</p>
            <div id="form-fields"></div>
            <ul class="errors" id="form-errors" hidden></ul>
            <div class="form-actions">
                <button type="button" class="ghost" id="form-cancel">Cancelar</button>
                <button type="submit" class="primary">Guardar captura</button>
            </div>
        </form>
    </dialog>

    <script src="offline.js"></script>
</body>
</html>
