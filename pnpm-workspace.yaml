packages:
  - '.'

minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  # Established lockfile versions that predate consistent npm provenance.
  - 'laravel-vite-plugin@3.2.0'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
blockExoticSubdeps: true

allowBuilds:
  unrs-resolver: true

publicHoistPattern:
  - '@inertiajs/core'

overrides:
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  source-map-js@<1.2.2: ^1.2.2
  shell-quote@<1.11.0: ^1.11.0
  zod@<4.6.6: ^4.6.6
