packages:
    - '.'

minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
    # Established lockfile versions that predate consistent npm provenance.
    - 'laravel-vite-plugin@3.2.0'
    - 'semver@6.3.1'
    - 'undici-types@6.21.0'
blockExoticSubdeps: true

allowBuilds:
    unrs-resolver: true

publicHoistPattern:
    - '@inertiajs/core'
