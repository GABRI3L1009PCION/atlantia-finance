name: desktop

# Builds the desktop app installers (Windows .exe and Mac .dmg). Runs on demand, on a "desktop-v*" tag, and on
# changes to the desktop folder; the installers are attached to the run as downloadable artifacts.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  installers:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: macos-latest
            script: dist:mac
            name: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # Without a signing certificate the installers are unsigned; Windows and macOS warn before opening them.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlantia-finance-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
